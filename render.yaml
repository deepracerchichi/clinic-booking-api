services:
  - type: web
    name: clinic-booking-api
    runtime: node
    plan: free
    region: ohio # same region as the Neon database, to keep queries fast
    # --include=dev: TypeScript is a dev dependency and Render sets NODE_ENV=production during builds.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: API_KEY
        sync: false # a long random string you choose
